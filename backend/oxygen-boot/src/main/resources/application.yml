spring:
  application:
    name: oxygen-api
  datasource:
    url: ${OXYGEN_DB_URL:jdbc:postgresql://localhost:5432/oxygen}
    username: ${OXYGEN_DB_USER:oxygen}
    password: ${OXYGEN_DB_PASSWORD:local-only-change-me}
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${OXYGEN_API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

oxygen:
  environment: ${OXYGEN_ENVIRONMENT:local}
